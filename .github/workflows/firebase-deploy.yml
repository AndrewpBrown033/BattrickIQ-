name: Deploy to Firebase Hosting on Merge

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  deployments: write
  pull-requests: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production applet
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_BATTRICKIQ }}"
          channelId: live
          projectId: battrickiq
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      # Hosting only serves the static UI. /api/** is rewritten to Cloud Run
      # service "api" (see firebase.json). Without this step, diary/scout
      # keep talking to a stale Express backend.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_BATTRICKIQ }}"

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Cloud Run API backend
        run: |
          gcloud run deploy api \
            --source . \
            --region us-central1 \
            --project battrickiq \
            --quiet \
            --allow-unauthenticated
